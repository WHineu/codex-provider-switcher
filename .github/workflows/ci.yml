name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run offline and lifecycle tests
        run: /bin/zsh tests/run-tests.zsh

      - name: Build native macOS app
        run: /bin/zsh scripts/build-macos-app.zsh

      - name: Verify native app bundle
        shell: /bin/zsh {0}
        run: |
          set -eu
          readonly app="build/Codex Provider Switcher.app"
          /usr/bin/plutil -lint "${app}/Contents/Info.plist"
          [[ "$(/usr/bin/plutil -extract CFBundleShortVersionString raw "${app}/Contents/Info.plist")" == "0.2.1" ]]
          [[ "$(/usr/bin/plutil -extract CFBundleVersion raw "${app}/Contents/Info.plist")" == "6" ]]
          /usr/bin/codesign --verify --deep --strict "${app}"
          /usr/bin/cmp src/provider_switcher.py "${app}/Contents/Resources/provider_switcher.py"
          /usr/bin/cmp src/http11_gateway.py "${app}/Contents/Resources/http11_gateway.py"
          /usr/bin/cmp src/run-switcher.zsh "${app}/Contents/Resources/run-switcher.zsh"
          /usr/bin/cmp src/macos-app/Info.plist "${app}/Contents/Info.plist"
          /usr/bin/file "${app}/Contents/MacOS/CodexProviderSwitcher"
